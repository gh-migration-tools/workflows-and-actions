# This action is based on the `dynamic-uses` action by @jenseng
# https://github.com/jenseng/dynamic-uses/blob/main/action.yml
name: Dynamic Action
description: Dynamically resolves and runs another GitHub action

inputs:
  uses:
    description: 'Action reference or path, e.g. `actions/setup-node@v3`'
    required: true
  with:
    description: 'YAML/JSON string of `inputs` for the action, e.g. `node-version: 18` or `{"node-version": "18"}`'
    required: false
    default: '{}'
  secrets-json:
    description: Secrets as JSON object
    required: false
    default: '{}'
  debug:
    description: Show generated GitHub action
    required: false
    default: 'false'

outputs:
  outputs:
    description: 'JSON-ified `outputs` from the action, e.g. `{"node-version": "v18.12.0", "cache-hit": true}`'
    value: ${{ steps.run.outputs.outputs }}

runs:
  using: composite
  steps:
    - name: Setup
      shell: bash
      env:
        USES: ${{ inputs.uses }}
        WITH: ${{ inputs.with }}
        OUTPUTS: ${{ '${{ toJSON(steps.run.outputs) }}' }}
      run: |
        mkdir -p ./__dynamic-action-generated &&
        cat <<DYNAMIC_ACTION_EOF >./__dynamic-action-generated/action.yml
        outputs:
          outputs:
            value: $OUTPUTS
        runs:
          using: composite
          steps:
          - name: Delete generated action
            shell: bash
            run: rm -rf ./__dynamic-action-generated

          - name: Run
            id: run
            uses: '$(echo "$USES" | sed "s/'/''/g")'
            with:
        $(echo "$WITH" | sed -E "s/^/      /; s/\\\$\\{\\{/\\\${{'$'}}{{/g")
        DYNAMIC_ACTION_EOF

    - name: Debug
      if: ${{ inputs.debug != 'false' }}
      shell: bash
      run: cat ./__dynamic-action-generated/action.yml

    - name: Run
      id: run
      uses: ./__dynamic-action-generated
      env:
        SECRETS_JSON: ${{ inputs.secrets-json }}

    - name: Cleanup
      if: ${{ always() && steps.run.outcome != 'success' }}
      shell: bash
      run: rm -rf ./__dynamic-action-generated