name: jfrog-rt-build-discard
description: 'Discard builds by setting retention parameters.'

inputs:
  build-name:
    description: 'Build name.'
    required: true
    default: ''
  format:
    description: 'Defines the output format of the command. Acceptable values are: `json`.'
    required: false
    default: ''
  access-token:
    description: 'JFrog access token.'
    required: false
    default: ''
  async:
    description: 'If set to `true`, build discard will run asynchronously and will not wait for response.'
    required: false
    default: 'false'
  delete-artifacts:
    description: 'If set to `true`, automatically removes build artifacts stored in Artifactory.'
    required: false
    default: 'false'
  exclude-builds:
    description: 'List of comma-separated (`,`) build numbers in the form of `value1,value2,...`, that should not be removed from Artifactory.'
    required: false
    default: ''
  insecure-tls:
    description: 'Set to `true` to skip TLS certificates verification.'
    required: false
    default: 'false'
  max-builds:
    description: 'The maximum number of builds to store in Artifactory.'
    required: false
    default: ''
  max-days:
    description: 'The maximum number of days to keep builds in Artifactory.'
    required: false
    default: ''
  password:
    description: 'JFrog password.'
    required: false
    default: ''
  project:
    description: 'JFrog Artifactory project key.'
    required: false
    default: ''
  server-id:
    description: 'Server ID configured using the `jf config` command.'
    required: false
    default: ''
  ssh-key-path:
    description: 'SSH key file path.'
    required: false
    default: ''
  ssh-passphrase:
    description: 'SSH key passphrase.'
    required: false
    default: ''
  url:
    description: 'JFrog Platform URL. (example: `https://acme.jfrog.io`)'
    required: false
    default: ''
  user:
    description: 'JFrog username.'
    required: false
    default: ''
  shell:
    description: 'Shell to use for run steps. Acceptable values are: `bash`, `powershell`, `pwsh`.'
    required: false
    default: 'bash'
  is-test:
    description: 'Indicates if the action is tested.'
    required: false
    default: 'false'

outputs:
  command:
    description: The JFrog command
    value: ${{ steps.run_bash.outputs.command || steps.run_pwsh.outputs.command }}

runs:
  using: composite
  steps:
    - name: Run JFrog CLI command
      id: run_bash
      if: ${{ inputs.shell == 'bash' }}
      shell: bash
      env:
        BUILD_NAME: ${{ inputs.build-name }}
        FORMAT: ${{ inputs.format }}
        ACCESS_TOKEN: ${{ inputs.access-token }}
        ASYNC: ${{ inputs.async }}
        DELETE_ARTIFACTS: ${{ inputs.delete-artifacts }}
        EXCLUDE_BUILDS: ${{ inputs.exclude-builds }}
        INSECURE_TLS: ${{ inputs.insecure-tls }}
        MAX_BUILDS: ${{ inputs.max-builds }}
        MAX_DAYS: ${{ inputs.max-days }}
        PASSWORD: ${{ inputs.password }}
        PROJECT: ${{ inputs.project }}
        SERVER_ID: ${{ inputs.server-id }}
        SSH_KEY_PATH: ${{ inputs.ssh-key-path }}
        SSH_PASSPHRASE: ${{ inputs.ssh-passphrase }}
        URL: ${{ inputs.url }}
        USER: ${{ inputs.user }}
        IS_TEST: ${{ inputs.is-test }}
      run: |
        arguments=(
          'rt'
          'build-discard'
          "$BUILD_NAME"
        )

        if [[ -n "$FORMAT" ]]; then
          arguments+=("--format=$FORMAT")
        fi

        if [[ -n "$ACCESS_TOKEN" ]]; then
          arguments+=("--access-token=$ACCESS_TOKEN")
        fi

        if [[ "$ASYNC" == 'true' ]]; then
          arguments+=('--async')
        fi

        if [[ "$DELETE_ARTIFACTS" == 'true' ]]; then
          arguments+=('--delete-artifacts')
        fi

        if [[ -n "$EXCLUDE_BUILDS" ]]; then
          arguments+=("--exclude-builds=$EXCLUDE_BUILDS")
        fi

        if [[ "$INSECURE_TLS" == 'true' ]]; then
          arguments+=('--insecure-tls')
        fi

        if [[ -n "$MAX_BUILDS" ]]; then
          arguments+=("--max-builds=$MAX_BUILDS")
        fi

        if [[ -n "$MAX_DAYS" ]]; then
          arguments+=("--max-days=$MAX_DAYS")
        fi

        if [[ -n "$PASSWORD" ]]; then
          arguments+=("--password=$PASSWORD")
        fi

        if [[ -n "$PROJECT" ]]; then
          arguments+=("--project=$PROJECT")
        fi

        if [[ -n "$SERVER_ID" ]]; then
          arguments+=("--server-id=$SERVER_ID")
        fi

        if [[ -n "$SSH_KEY_PATH" ]]; then
          arguments+=("--ssh-key-path=$SSH_KEY_PATH")
        fi

        if [[ -n "$SSH_PASSPHRASE" ]]; then
          arguments+=("--ssh-passphrase=$SSH_PASSPHRASE")
        fi

        if [[ -n "$URL" ]]; then
          arguments+=("--url=$URL")
        fi

        if [[ -n "$USER" ]]; then
          arguments+=("--user=$USER")
        fi

        command='jf'
        for argument in "${arguments[@]}"; do
          printf -v escaped '%q' "$argument"
          command+=" $escaped"
        done

        echo "Executing JFrog CLI Command:"
        echo "$command"
        echo "command=$command" >> "$GITHUB_OUTPUT"

        if [[ "$IS_TEST" == 'false' ]]; then
          jf "${arguments[@]}"
        fi

    - name: Run JFrog CLI command
      id: run_pwsh
      if: ${{ inputs.shell == 'powershell' || inputs.shell == 'pwsh' }}
      shell: ${{ inputs.shell }}
      env:
        BUILD_NAME: ${{ inputs.build-name }}
        FORMAT: ${{ inputs.format }}
        ACCESS_TOKEN: ${{ inputs.access-token }}
        ASYNC: ${{ inputs.async }}
        DELETE_ARTIFACTS: ${{ inputs.delete-artifacts }}
        EXCLUDE_BUILDS: ${{ inputs.exclude-builds }}
        INSECURE_TLS: ${{ inputs.insecure-tls }}
        MAX_BUILDS: ${{ inputs.max-builds }}
        MAX_DAYS: ${{ inputs.max-days }}
        PASSWORD: ${{ inputs.password }}
        PROJECT: ${{ inputs.project }}
        SERVER_ID: ${{ inputs.server-id }}
        SSH_KEY_PATH: ${{ inputs.ssh-key-path }}
        SSH_PASSPHRASE: ${{ inputs.ssh-passphrase }}
        URL: ${{ inputs.url }}
        USER: ${{ inputs.user }}
        IS_TEST: ${{ inputs.is-test }}
      run: |
        $arguments = @(
          'rt'
          'build-discard'
          "$env:BUILD_NAME"
        )

        if (-not [string]::IsNullOrWhiteSpace($env:FORMAT)) {
          $arguments += "--format=$env:FORMAT"
        }

        if (-not [string]::IsNullOrWhiteSpace($env:ACCESS_TOKEN)) {
          $arguments += "--access-token=$env:ACCESS_TOKEN"
        }

        if ($env:ASYNC -eq 'true') {
          $arguments += '--async'
        }

        if ($env:DELETE_ARTIFACTS -eq 'true') {
          $arguments += '--delete-artifacts'
        }

        if (-not [string]::IsNullOrWhiteSpace($env:EXCLUDE_BUILDS)) {
          $arguments += "--exclude-builds=$env:EXCLUDE_BUILDS"
        }

        if ($env:INSECURE_TLS -eq 'true') {
          $arguments += '--insecure-tls'
        }

        if (-not [string]::IsNullOrWhiteSpace($env:MAX_BUILDS)) {
          $arguments += "--max-builds=$env:MAX_BUILDS"
        }

        if (-not [string]::IsNullOrWhiteSpace($env:MAX_DAYS)) {
          $arguments += "--max-days=$env:MAX_DAYS"
        }

        if (-not [string]::IsNullOrWhiteSpace($env:PASSWORD)) {
          $arguments += "--password=$env:PASSWORD"
        }

        if (-not [string]::IsNullOrWhiteSpace($env:PROJECT)) {
          $arguments += "--project=$env:PROJECT"
        }

        if (-not [string]::IsNullOrWhiteSpace($env:SERVER_ID)) {
          $arguments += "--server-id=$env:SERVER_ID"
        }

        if (-not [string]::IsNullOrWhiteSpace($env:SSH_KEY_PATH)) {
          $arguments += "--ssh-key-path=$env:SSH_KEY_PATH"
        }

        if (-not [string]::IsNullOrWhiteSpace($env:SSH_PASSPHRASE)) {
          $arguments += "--ssh-passphrase=$env:SSH_PASSPHRASE"
        }

        if (-not [string]::IsNullOrWhiteSpace($env:URL)) {
          $arguments += "--url=$env:URL"
        }

        if (-not [string]::IsNullOrWhiteSpace($env:USER)) {
          $arguments += "--user=$env:USER"
        }

        $command = "jf $($arguments -join ' ')"
        $delimiter = [guid]::NewGuid().ToString()

        @(
          "command<<$delimiter"
          $command
          $delimiter
        ) >> $env:GITHUB_OUTPUT

        if ($env:IS_TEST -eq 'false') {
          & jf @arguments
        }
