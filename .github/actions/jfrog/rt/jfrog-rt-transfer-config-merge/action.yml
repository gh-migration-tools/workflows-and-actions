name: jfrog-rt-transfer-config-merge
description: 'Merge projects and repositories from a source Artifactory instance to a target Artifactory instance, if no conflicts are found.'

inputs:
  source-server-id:
    description: 'The source server ID. The configuration will be exported from this server.'
    required: true
    default: ''
  target-server-id:
    description: 'The target server ID. The configuration will be imported to this server.'
    required: true
    default: ''
  exclude-projects:
    description: 'List of semicolon-separated (`;`) JFrog Projects to exclude from the transfer. You can use wildcards to specify patterns for the project keys.'
    required: false
    default: ''
  exclude-repos:
    description: 'List of semicolon-separated (`;`) repositories to exclude from the transfer. You can use wildcards to specify patterns for the repositories'' names.'
    required: false
    default: ''
  format:
    description: 'Defines the output format of the command. Acceptable values are: `json`, `table`.'
    required: false
    default: ''
  include-projects:
    description: 'List of semicolon-separated (`;`) JFrog Project keys to include in the transfer. You can use wildcards to specify patterns for the JFrog Project keys.'
    required: false
    default: ''
  include-repos:
    description: 'List of semicolon-separated (`;`) repositories to include in the transfer. You can use wildcards to specify patterns for the repositories'' names.'
    required: false
    default: ''
  shell:
    description: 'Shell to use for run steps. Acceptable values are: `bash`, `powershell`, `pwsh`.'
    required: false
    default: 'bash'
  is-test:
    description: 'Indicates if the action is tested.'
    required: false
    default: 'false'

outputs:
  command:
    description: The JFrog command
    value: ${{ steps.run_bash.outputs.command || steps.run_pwsh.outputs.command }}

runs:
  using: composite
  steps:
    - name: Run JFrog CLI command
      id: run_bash
      if: ${{ inputs.shell == 'bash' }}
      shell: bash
      env:
        SOURCE_SERVER_ID: ${{ inputs.source-server-id }}
        TARGET_SERVER_ID: ${{ inputs.target-server-id }}
        EXCLUDE_PROJECTS: ${{ inputs.exclude-projects }}
        EXCLUDE_REPOS: ${{ inputs.exclude-repos }}
        FORMAT: ${{ inputs.format }}
        INCLUDE_PROJECTS: ${{ inputs.include-projects }}
        INCLUDE_REPOS: ${{ inputs.include-repos }}
        IS_TEST: ${{ inputs.is-test }}
      run: |
        arguments=(
          'rt'
          'transfer-config-merge'
          "$SOURCE_SERVER_ID"
          "$TARGET_SERVER_ID"
        )

        if [[ -n "$EXCLUDE_PROJECTS" ]]; then
          arguments+=("--exclude-projects=$EXCLUDE_PROJECTS")
        fi

        if [[ -n "$EXCLUDE_REPOS" ]]; then
          arguments+=("--exclude-repos=$EXCLUDE_REPOS")
        fi

        if [[ -n "$FORMAT" ]]; then
          arguments+=("--format=$FORMAT")
        fi

        if [[ -n "$INCLUDE_PROJECTS" ]]; then
          arguments+=("--include-projects=$INCLUDE_PROJECTS")
        fi

        if [[ -n "$INCLUDE_REPOS" ]]; then
          arguments+=("--include-repos=$INCLUDE_REPOS")
        fi

        command='jf'
        for argument in "${arguments[@]}"; do
          printf -v escaped '%q' "$argument"
          command+=" $escaped"
        done

        echo "Executing JFrog CLI Command:"
        echo "$command"
        echo "command=$command" >> "$GITHUB_OUTPUT"

        if [[ "$IS_TEST" == 'false' ]]; then
          jf "${arguments[@]}"
        fi

    - name: Run JFrog CLI command
      id: run_pwsh
      if: ${{ inputs.shell == 'powershell' || inputs.shell == 'pwsh' }}
      shell: ${{ inputs.shell }}
      env:
        SOURCE_SERVER_ID: ${{ inputs.source-server-id }}
        TARGET_SERVER_ID: ${{ inputs.target-server-id }}
        EXCLUDE_PROJECTS: ${{ inputs.exclude-projects }}
        EXCLUDE_REPOS: ${{ inputs.exclude-repos }}
        FORMAT: ${{ inputs.format }}
        INCLUDE_PROJECTS: ${{ inputs.include-projects }}
        INCLUDE_REPOS: ${{ inputs.include-repos }}
        IS_TEST: ${{ inputs.is-test }}
      run: |
        $arguments = @(
          'rt'
          'transfer-config-merge'
          "$env:SOURCE_SERVER_ID"
          "$env:TARGET_SERVER_ID"
        )

        if (-not [string]::IsNullOrWhiteSpace($env:EXCLUDE_PROJECTS)) {
          $arguments += "--exclude-projects=$env:EXCLUDE_PROJECTS"
        }

        if (-not [string]::IsNullOrWhiteSpace($env:EXCLUDE_REPOS)) {
          $arguments += "--exclude-repos=$env:EXCLUDE_REPOS"
        }

        if (-not [string]::IsNullOrWhiteSpace($env:FORMAT)) {
          $arguments += "--format=$env:FORMAT"
        }

        if (-not [string]::IsNullOrWhiteSpace($env:INCLUDE_PROJECTS)) {
          $arguments += "--include-projects=$env:INCLUDE_PROJECTS"
        }

        if (-not [string]::IsNullOrWhiteSpace($env:INCLUDE_REPOS)) {
          $arguments += "--include-repos=$env:INCLUDE_REPOS"
        }

        $command = "jf $($arguments -join ' ')"
        $delimiter = [guid]::NewGuid().ToString()

        @(
          "command<<$delimiter"
          $command
          $delimiter
        ) >> $env:GITHUB_OUTPUT

        if ($env:IS_TEST -eq 'false') {
          & jf @arguments
        }
