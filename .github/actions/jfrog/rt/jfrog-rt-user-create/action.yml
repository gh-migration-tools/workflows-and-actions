name: jfrog-rt-user-create
description: 'Create a new user.'

inputs:
  username:
    description: 'The username argument.'
    required: true
    default: ''
  password:
    description: 'The password argument.'
    required: true
    default: ''
  email:
    description: 'The email argument.'
    required: true
    default: ''
  access-token:
    description: 'JFrog access token.'
    required: false
    default: ''
  admin:
    description: 'Set to `true` if you''d like to create an admin user.'
    required: false
    default: 'false'
  replace:
    description: 'Set to `true` if you''d like existing users or groups to be replaced.'
    required: false
    default: 'false'
  server-id:
    description: 'Server ID configured using the `jf config` command.'
    required: false
    default: ''
  ssh-key-path:
    description: 'SSH key file path.'
    required: false
    default: ''
  ssh-passphrase:
    description: 'SSH key passphrase.'
    required: false
    default: ''
  url:
    description: 'JFrog Artifactory URL. (example: `https://acme.jfrog.io/artifactory`)'
    required: false
    default: ''
  user:
    description: 'JFrog username.'
    required: false
    default: ''
  users-groups:
    description: 'A list of comma-separated (`,`) groups for the new users to be associated with.'
    required: false
    default: ''
  shell:
    description: 'Shell to use for run steps. Acceptable values are: `bash`, `powershell`, `pwsh`.'
    required: false
    default: 'bash'
  is-test:
    description: 'Indicates if the action is tested.'
    required: false
    default: 'false'

outputs:
  command:
    description: The JFrog command
    value: ${{ steps.run_bash.outputs.command || steps.run_pwsh.outputs.command }}

runs:
  using: composite
  steps:
    - name: Run JFrog CLI command
      id: run_bash
      if: ${{ inputs.shell == 'bash' }}
      shell: bash
      env:
        USERNAME: ${{ inputs.username }}
        PASSWORD: ${{ inputs.password }}
        EMAIL: ${{ inputs.email }}
        ACCESS_TOKEN: ${{ inputs.access-token }}
        ADMIN: ${{ inputs.admin }}
        REPLACE: ${{ inputs.replace }}
        SERVER_ID: ${{ inputs.server-id }}
        SSH_KEY_PATH: ${{ inputs.ssh-key-path }}
        SSH_PASSPHRASE: ${{ inputs.ssh-passphrase }}
        URL: ${{ inputs.url }}
        USER: ${{ inputs.user }}
        USERS_GROUPS: ${{ inputs.users-groups }}
        IS_TEST: ${{ inputs.is-test }}
      run: |
        arguments=(
          'rt'
          'user-create'
          "$USERNAME"
          "$PASSWORD"
          "$EMAIL"
        )

        if [[ -n "$ACCESS_TOKEN" ]]; then
          arguments+=("--access-token=$ACCESS_TOKEN")
        fi

        if [[ "$ADMIN" == 'true' ]]; then
          arguments+=('--admin')
        fi

        if [[ "$REPLACE" == 'true' ]]; then
          arguments+=('--replace')
        fi

        if [[ -n "$SERVER_ID" ]]; then
          arguments+=("--server-id=$SERVER_ID")
        fi

        if [[ -n "$SSH_KEY_PATH" ]]; then
          arguments+=("--ssh-key-path=$SSH_KEY_PATH")
        fi

        if [[ -n "$SSH_PASSPHRASE" ]]; then
          arguments+=("--ssh-passphrase=$SSH_PASSPHRASE")
        fi

        if [[ -n "$URL" ]]; then
          arguments+=("--url=$URL")
        fi

        if [[ -n "$USER" ]]; then
          arguments+=("--user=$USER")
        fi

        if [[ -n "$USERS_GROUPS" ]]; then
          arguments+=("--users-groups=$USERS_GROUPS")
        fi

        command='jf'
        for argument in "${arguments[@]}"; do
          printf -v escaped '%q' "$argument"
          command+=" $escaped"
        done

        echo "Executing JFrog CLI Command:"
        echo "$command"
        echo "command=$command" >> "$GITHUB_OUTPUT"

        if [[ "$IS_TEST" == 'false' ]]; then
          jf "${arguments[@]}"
        fi

    - name: Run JFrog CLI command
      id: run_pwsh
      if: ${{ inputs.shell == 'powershell' || inputs.shell == 'pwsh' }}
      shell: ${{ inputs.shell }}
      env:
        USERNAME: ${{ inputs.username }}
        PASSWORD: ${{ inputs.password }}
        EMAIL: ${{ inputs.email }}
        ACCESS_TOKEN: ${{ inputs.access-token }}
        ADMIN: ${{ inputs.admin }}
        REPLACE: ${{ inputs.replace }}
        SERVER_ID: ${{ inputs.server-id }}
        SSH_KEY_PATH: ${{ inputs.ssh-key-path }}
        SSH_PASSPHRASE: ${{ inputs.ssh-passphrase }}
        URL: ${{ inputs.url }}
        USER: ${{ inputs.user }}
        USERS_GROUPS: ${{ inputs.users-groups }}
        IS_TEST: ${{ inputs.is-test }}
      run: |
        $arguments = @(
          'rt'
          'user-create'
          "$env:USERNAME"
          "$env:PASSWORD"
          "$env:EMAIL"
        )

        if (-not [string]::IsNullOrWhiteSpace($env:ACCESS_TOKEN)) {
          $arguments += "--access-token=$env:ACCESS_TOKEN"
        }

        if ($env:ADMIN -eq 'true') {
          $arguments += '--admin'
        }

        if ($env:REPLACE -eq 'true') {
          $arguments += '--replace'
        }

        if (-not [string]::IsNullOrWhiteSpace($env:SERVER_ID)) {
          $arguments += "--server-id=$env:SERVER_ID"
        }

        if (-not [string]::IsNullOrWhiteSpace($env:SSH_KEY_PATH)) {
          $arguments += "--ssh-key-path=$env:SSH_KEY_PATH"
        }

        if (-not [string]::IsNullOrWhiteSpace($env:SSH_PASSPHRASE)) {
          $arguments += "--ssh-passphrase=$env:SSH_PASSPHRASE"
        }

        if (-not [string]::IsNullOrWhiteSpace($env:URL)) {
          $arguments += "--url=$env:URL"
        }

        if (-not [string]::IsNullOrWhiteSpace($env:USER)) {
          $arguments += "--user=$env:USER"
        }

        if (-not [string]::IsNullOrWhiteSpace($env:USERS_GROUPS)) {
          $arguments += "--users-groups=$env:USERS_GROUPS"
        }

        $command = "jf $($arguments -join ' ')"
        $delimiter = [guid]::NewGuid().ToString()

        @(
          "command<<$delimiter"
          $command
          $delimiter
        ) >> $env:GITHUB_OUTPUT

        if ($env:IS_TEST -eq 'false') {
          & jf @arguments
        }
