name: 'Examples: Run dynamic action'

on:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Build
        uses: $/tests/actions/dynamic-action
        with:
          pre-build-steps: |
            - name: Run pre-build step 1
              shell: bash
              run: echo "Execute pre-build step 1"
            - name: Run pre-build step 2
              shell: bash
              run: echo "Execute pre-build step 2"
          post-build-steps: |
            - name: Run post-build step 1
              shell: bash
              run: echo "Execute post-build step 1"
            - name: Run post-build step 2
              shell: bash
              run: echo "Execute post-build step 2"