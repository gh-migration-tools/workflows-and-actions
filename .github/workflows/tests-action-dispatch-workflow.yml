name: Tests action 'dispatch-workflow'

on:
  workflow_call:

jobs:
  should_dispatch_workflow:
    name: Should dispatch workflow
    runs-on: ubuntu-latest
    steps:
      - name: Act
        uses: $/.github/actions/dispatch-workflow
        id: act
        with:
          client-id: ${{ vars.AUTHAPP_CLIENT_ID }}
          private-key: ${{ secrets.AUTHAPP_PRIVATE_KEY }}
          owner-repo: ${{ github.repository }}
          ref: main
          workflow-file: tests-dispatch-workflow-target.yml
          payload-inputs-json: |
            {
              "trigger": "action",
              "firstname": "John",
              "lastname": "Doe"
            }

      - name: Assert
        shell: bash
        env:
          RUN_ID: ${{ steps.act.outputs.run-id }}
          RUN_NUMBER: ${{ steps.act.outputs.run-number }}
          RUN_NAME: ${{ steps.act.outputs.run-name }}
          STATUS: ${{ steps.act.outputs.status }}
          CONCLUSION: ${{ steps.act.outputs.conclusion }}
          WORKFLOW_ID: ${{ steps.act.outputs.workflow-id }}
        run: |
          error=false

          if [ -z "${RUN_ID:-}" ]; then
            echo "The workflow output 'run-id' is empty"
            error=true
          else
            echo "run-id: ${RUN_ID}"
          fi

          if [ -z "${RUN_NUMBER:-}" ]; then
            echo "The workflow output 'run-number' is empty"
            error=true
          else
            echo "run-number: ${RUN_NUMBER}"
          fi

          if [ -z "${RUN_NAME:-}" ]; then
            echo "The workflow output 'run-name' is empty"
            error=true
          else
            echo "run-name: ${RUN_NAME}"
          fi

          if [ -z "${STATUS:-}" ]; then
            echo "The workflow output 'status' is empty"
            error=true
          else
            echo "status: ${STATUS}"
          fi

          if [ -z "${CONCLUSION:-}" ]; then
            echo "The workflow output 'conclusion' is empty"
            error=true
          else
            echo "conclusion: ${CONCLUSION}"
          fi

          if [ -z "${WORKFLOW_ID:-}" ]; then
            echo "The workflow output 'workflow-id' is empty"
            error=true
          else
            echo "workflow-id: ${WORKFLOW_ID}"
          fi

          if [ "$error" = true ]; then
            echo "::error::Some 'trigger-repository-workflow.yml' workflow outputs are invalid"
            exit 1
          fi