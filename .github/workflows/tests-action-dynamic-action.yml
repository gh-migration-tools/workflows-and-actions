name: Tests action 'dynamic-action'

on:
  workflow_call:

jobs:
  should_run_action_with_inline_json_inputs:
    name: Should run action with inline JSON inputs
    runs-on: ubuntu-latest
    steps:
      - name: Act
        uses: $/.github/actions/dynamic-action
        id: act
        with:
          debug: true
          uses: $/tests/actions/action-with-inputs
          with: '{ "salutation": "Mr.", "firstname": "John", "lastname": "Doe" }'

      - name: Assert
        shell: bash
        env:
          RESULT: ${{ toJSON(steps.act.outputs) }}
        run: |
          result="${RESULT}"
          expected_result=$(cat <<'EOF'
          {
            "outputs": "{\n  \"result\": \"Hello Mr. John Doe\"\n}"
          }
          EOF
          )

          echo "result:"
          echo "$result"

          if [[ "$result" != "$expected_result" ]]; then
            echo ""
            echo "expected result:"
            echo "$expected_result"
            echo "::error::The result don't match the expected result."
            exit 1
          fi

  should_run_action_with_json_inputs:
    name: Should run action with JSON inputs
    runs-on: ubuntu-latest
    steps:
      - name: Act
        uses: $/.github/actions/dynamic-action
        id: act
        with:
          debug: true
          uses: $/tests/actions/action-with-inputs
          with: |
            {
              "salutation": "Mr.",
              "firstname": "John",
              "lastname": "Doe"
            }

      - name: Assert
        shell: bash
        env:
          RESULT: ${{ toJSON(steps.act.outputs) }}
        run: |
          result="${RESULT}"
          expected_result=$(cat <<'EOF'
          {
            "outputs": "{\n  \"result\": \"Hello Mr. John Doe\"\n}"
          }
