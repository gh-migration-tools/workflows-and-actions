name: Tests action 'jfrog-apk'

on:
  workflow_call:

jobs:
  should_return_command:
    name: Should return command (${{ matrix.shell }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shell: [bash, pwsh]
    steps:
      - name: Arrange
        id: arrange
        uses: $/.github/actions/tests/helper/arrange-expected-result
        with:
          shell: ${{ matrix.shell }}
          expected-result-bash: jf apk \[SUBCOMMAND\] --alpine-version=ALPINE-VERSION --arch=ARCH --branch=BRANCH --build-name=BUILD-NAME --build-number=BUILD-NUMBER --module=MODULE --password=PASSWORD --project=PROJECT --repo=REPO --server-id=SERVER-ID --user=USER
          expected-result-pwsh: jf apk [SUBCOMMAND] --alpine-version=ALPINE-VERSION --arch=ARCH --branch=BRANCH --build-name=BUILD-NAME --build-number=BUILD-NUMBER --module=MODULE --password=PASSWORD --project=PROJECT --repo=REPO --server-id=SERVER-ID --user=USER

      - name: Act
        id: act
        uses: $/.github/actions/jfrog/package-managers/jfrog-apk
        with:
          subcommand: '[SUBCOMMAND]'
          alpine-version: 'ALPINE-VERSION'
          arch: 'ARCH'
          branch: 'BRANCH'
          build-name: 'BUILD-NAME'
          build-number: 'BUILD-NUMBER'
          module: 'MODULE'
          password: 'PASSWORD'
          project: 'PROJECT'
          repo: 'REPO'
          server-id: 'SERVER-ID'
          user: 'USER'
          shell: ${{ matrix.shell }}
          is-test: 'true'

      - name: Assert
        uses: $/.github/actions/tests/helper/assert-result
        with:
          result: ${{ steps.act.outputs.command }}
          expected-result: ${{ steps.arrange.outputs.expected-result }}