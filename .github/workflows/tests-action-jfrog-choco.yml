name: Tests action 'jfrog-choco'

on:
  workflow_call:

jobs:
  should_return_command:
    name: Should return command (${{ matrix.shell }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shell: [bash, pwsh]
    steps:
      - name: Arrange
        id: arrange
        uses: $/.github/actions/tests/helper/arrange-expected-result
        with:
          shell: ${{ matrix.shell }}
          expected-result-bash: jf choco \[ARGS\] --build-name=BUILD-NAME --build-number=BUILD-NUMBER --module=MODULE --project=PROJECT --repo=REPO --repo-resolve=REPO-RESOLVE --server-id=SERVER-ID
          expected-result-pwsh: jf choco [ARGS] --build-name=BUILD-NAME --build-number=BUILD-NUMBER --module=MODULE --project=PROJECT --repo=REPO --repo-resolve=REPO-RESOLVE --server-id=SERVER-ID

      - name: Act
        id: act
        uses: $/.github/actions/jfrog/package-managers/jfrog-choco
        with:
          args: '[ARGS]'
          build-name: 'BUILD-NAME'
          build-number: 'BUILD-NUMBER'
          module: 'MODULE'
          project: 'PROJECT'
          repo: 'REPO'
          repo-resolve: 'REPO-RESOLVE'
          server-id: 'SERVER-ID'
          shell: ${{ matrix.shell }}
          is-test: 'true'

      - name: Assert
        uses: $/.github/actions/tests/helper/assert-result
        with:
          result: ${{ steps.act.outputs.command }}
          expected-result: ${{ steps.arrange.outputs.expected-result }}