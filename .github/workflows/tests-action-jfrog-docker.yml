name: Tests action 'jfrog-docker'

on:
  workflow_call:

jobs:
  should_return_command:
    name: Should return command (${{ matrix.shell }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shell: [bash, pwsh]
    steps:
      - name: Arrange
        id: arrange
        uses: $/.github/actions/tests/helper/arrange-expected-result
        with:
          shell: ${{ matrix.shell }}
          expected-result-bash: jf docker \[ARGS\] --build-name=BUILD-NAME --build-number=BUILD-NUMBER --bypass-archive-limits --detailed-summary --extended-table --fail=FAIL --fixable-only=FIXABLE-ONLY --format=FORMAT --licenses --min-severity=MIN-SEVERITY --module=MODULE --project=PROJECT --repo-path=REPO-PATH --server-id=SERVER-ID --skip-login --threads=THREADS --validate-sha --vuln --watches=WATCHES
          expected-result-pwsh: jf docker [ARGS] --build-name=BUILD-NAME --build-number=BUILD-NUMBER --bypass-archive-limits --detailed-summary --extended-table --fail=FAIL --fixable-only=FIXABLE-ONLY --format=FORMAT --licenses --min-severity=MIN-SEVERITY --module=MODULE --project=PROJECT --repo-path=REPO-PATH --server-id=SERVER-ID --skip-login --threads=THREADS --validate-sha --vuln --watches=WATCHES

      - name: Act
        id: act
        uses: $/.github/actions/jfrog/package-managers/jfrog-docker
        with:
          args: '[ARGS]'
          build-name: 'BUILD-NAME'
          build-number: 'BUILD-NUMBER'
          bypass-archive-limits: 'true'
          detailed-summary: 'true'
          extended-table: 'true'
          fail: 'FAIL'
          fixable-only: 'FIXABLE-ONLY'
          format: 'FORMAT'
          licenses: 'true'
          min-severity: 'MIN-SEVERITY'
          module: 'MODULE'
          project: 'PROJECT'
          repo-path: 'REPO-PATH'
          server-id: 'SERVER-ID'
          skip-login: 'true'
          threads: 'THREADS'
          validate-sha: 'true'
          vuln: 'true'
          watches: 'WATCHES'
          shell: ${{ matrix.shell }}
          is-test: 'true'

      - name: Assert
        uses: $/.github/actions/tests/helper/assert-result
        with:
          result: ${{ steps.act.outputs.command }}
          expected-result: ${{ steps.arrange.outputs.expected-result }}