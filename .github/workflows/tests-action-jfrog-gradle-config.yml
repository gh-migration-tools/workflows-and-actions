name: Tests action 'jfrog-gradle-config'

on:
  workflow_call:

jobs:
  should_return_command:
    name: Should return command (${{ matrix.shell }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shell: [bash, pwsh]
    steps:
      - name: Act
        id: act
        uses: $/.github/actions/jfrog/package-managers/jfrog-gradle-config
        with:
          deploy-ivy-desc: 'DEPLOY-IVY-DESC'
          deploy-maven-desc: 'DEPLOY-MAVEN-DESC'
          global: 'true'
          ivy-artifacts-pattern: 'IVY-ARTIFACTS-PATTERN'
          ivy-desc-pattern: 'IVY-DESC-PATTERN'
          repo-deploy: 'REPO-DEPLOY'
          repo-resolve: 'REPO-RESOLVE'
          server-id-deploy: 'SERVER-ID-DEPLOY'
          server-id-resolve: 'SERVER-ID-RESOLVE'
          use-wrapper: 'true'
          uses-plugin: 'true'
          shell: ${{ matrix.shell }}
          is-test: 'true'

      - name: Assert
        uses: $/.github/actions/tests/helper/assert-result
        with:
          result: ${{ steps.act.outputs.command }}
          expected-result: jf gradle-config --deploy-ivy-desc=DEPLOY-IVY-DESC --deploy-maven-desc=DEPLOY-MAVEN-DESC --global --ivy-artifacts-pattern=IVY-ARTIFACTS-PATTERN --ivy-desc-pattern=IVY-DESC-PATTERN --repo-deploy=REPO-DEPLOY --repo-resolve=REPO-RESOLVE --server-id-deploy=SERVER-ID-DEPLOY --server-id-resolve=SERVER-ID-RESOLVE --use-wrapper --uses-plugin