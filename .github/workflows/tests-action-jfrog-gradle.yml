name: Tests action 'jfrog-gradle'

on:
  workflow_call:

jobs:
  should_return_command:
    name: Should return command (${{ matrix.shell }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shell: [bash, pwsh]
    steps:
      - name: Arrange
        id: arrange
        uses: $/.github/actions/tests/helper/arrange-expected-result
        with:
          shell: ${{ matrix.shell }}
          expected-result-bash: jf gradle \[TASKS-AND-OPTIONS\] --build-name=BUILD-NAME --build-number=BUILD-NUMBER --detailed-summary --format=FORMAT --project=PROJECT --scan --server-id=SERVER-ID --threads=THREADS
          expected-result-pwsh: jf gradle [TASKS-AND-OPTIONS] --build-name=BUILD-NAME --build-number=BUILD-NUMBER --detailed-summary --format=FORMAT --project=PROJECT --scan --server-id=SERVER-ID --threads=THREADS

      - name: Act
        id: act
        uses: $/.github/actions/jfrog/package-managers/jfrog-gradle
        with:
          tasks-and-options: '[TASKS-AND-OPTIONS]'
          build-name: 'BUILD-NAME'
          build-number: 'BUILD-NUMBER'
          detailed-summary: 'true'
          format: 'FORMAT'
          project: 'PROJECT'
          scan: 'true'
          server-id: 'SERVER-ID'
          threads: 'THREADS'
          shell: ${{ matrix.shell }}
          is-test: 'true'

      - name: Assert
        uses: $/.github/actions/tests/helper/assert-result
        with:
          result: ${{ steps.act.outputs.command }}
          expected-result: ${{ steps.arrange.outputs.expected-result }}