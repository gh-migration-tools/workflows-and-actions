name: Tests action 'jfrog-poetry-config'

on:
  workflow_call:

jobs:
  should_return_command:
    name: Should return command (${{ matrix.shell }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shell: [bash, pwsh]
    steps:
      - name: Act
        id: act
        uses: $/.github/actions/jfrog/package-managers/jfrog-poetry-config
        with:
          global: 'true'
          repo-resolve: 'REPO-RESOLVE'
          server-id-resolve: 'SERVER-ID-RESOLVE'
          shell: ${{ matrix.shell }}
          is-test: 'true'

      - name: Assert
        uses: $/.github/actions/tests/helper/assert-result
        with:
          result: ${{ steps.act.outputs.command }}
          expected-result: jf poetry-config --global --repo-resolve=REPO-RESOLVE --server-id-resolve=SERVER-ID-RESOLVE