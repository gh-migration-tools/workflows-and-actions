name: Tests action 'jfrog-rt-build-collect-env'

on:
  workflow_call:

jobs:
  should_return_command:
    name: Should return command (${{ matrix.shell }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shell: [bash, pwsh]
    steps:
      - name: Arrange
        id: arrange
        uses: $/.github/actions/tests/helper/arrange-expected-result
        with:
          shell: ${{ matrix.shell }}
          expected-result-bash: jf rt build-collect-env \[BUILD-NAME\] \[BUILD-NUMBER\] --project=PROJECT
          expected-result-pwsh: jf rt build-collect-env [BUILD-NAME] [BUILD-NUMBER] --project=PROJECT

      - name: Act
        id: act
        uses: $/.github/actions/jfrog/rt/jfrog-rt-build-collect-env
        with:
          build-name: '[BUILD-NAME]'
          build-number: '[BUILD-NUMBER]'
          project: 'PROJECT'
          shell: ${{ matrix.shell }}
          is-test: 'true'

      - name: Assert
        uses: $/.github/actions/tests/helper/assert-result
        with:
          result: ${{ steps.act.outputs.command }}
          expected-result: ${{ steps.arrange.outputs.expected-result }}