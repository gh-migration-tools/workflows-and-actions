name: Tests action 'jfrog-rt-build-docker-create'

on:
  workflow_call:

jobs:
  should_return_command:
    name: Should return command (${{ matrix.shell }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shell: [bash, pwsh]
    steps:
      - name: Arrange
        id: arrange
        uses: $/.github/actions/tests/helper/arrange-expected-result
        with:
          shell: ${{ matrix.shell }}
          expected-result-bash: jf rt build-docker-create \[TARGET-REPO\] --access-token=ACCESS-TOKEN --build-name=BUILD-NAME --build-number=BUILD-NUMBER --image-file=IMAGE-FILE --module=MODULE --password=PASSWORD --project=PROJECT --server-id=SERVER-ID --ssh-key-path=SSH-KEY-PATH --ssh-passphrase=SSH-PASSPHRASE --url=URL --user=USER
          expected-result-pwsh: jf rt build-docker-create [TARGET-REPO] --access-token=ACCESS-TOKEN --build-name=BUILD-NAME --build-number=BUILD-NUMBER --image-file=IMAGE-FILE --module=MODULE --password=PASSWORD --project=PROJECT --server-id=SERVER-ID --ssh-key-path=SSH-KEY-PATH --ssh-passphrase=SSH-PASSPHRASE --url=URL --user=USER

      - name: Act
        id: act
        uses: $/.github/actions/jfrog/rt/jfrog-rt-build-docker-create
        with:
          target-repo: '[TARGET-REPO]'
          access-token: 'ACCESS-TOKEN'
          build-name: 'BUILD-NAME'
          build-number: 'BUILD-NUMBER'
          image-file: 'IMAGE-FILE'
          module: 'MODULE'
          password: 'PASSWORD'
          project: 'PROJECT'
          server-id: 'SERVER-ID'
          ssh-key-path: 'SSH-KEY-PATH'
          ssh-passphrase: 'SSH-PASSPHRASE'
          url: 'URL'
          user: 'USER'
          shell: ${{ matrix.shell }}
          is-test: 'true'

      - name: Assert
        uses: $/.github/actions/tests/helper/assert-result
        with:
          result: ${{ steps.act.outputs.command }}
          expected-result: ${{ steps.arrange.outputs.expected-result }}