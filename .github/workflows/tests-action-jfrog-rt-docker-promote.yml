name: Tests action 'jfrog-rt-docker-promote'

on:
  workflow_call:

jobs:
  should_return_command:
    name: Should return command (${{ matrix.shell }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shell: [bash, pwsh]
    steps:
      - name: Arrange
        id: arrange
        uses: $/.github/actions/tests/helper/arrange-expected-result
        with:
          shell: ${{ matrix.shell }}
          expected-result-bash: jf rt docker-promote \[SOURCE-DOCKER-IMAGE\] \[SOURCE-REPO\] \[TARGET-REPO\] --format=FORMAT --access-token=ACCESS-TOKEN --copy --password=PASSWORD --server-id=SERVER-ID --source-tag=SOURCE-TAG --ssh-key-path=SSH-KEY-PATH --ssh-passphrase=SSH-PASSPHRASE --target-docker-image=TARGET-DOCKER-IMAGE --target-tag=TARGET-TAG --url=URL --user=USER
          expected-result-pwsh: jf rt docker-promote [SOURCE-DOCKER-IMAGE] [SOURCE-REPO] [TARGET-REPO] --format=FORMAT --access-token=ACCESS-TOKEN --copy --password=PASSWORD --server-id=SERVER-ID --source-tag=SOURCE-TAG --ssh-key-path=SSH-KEY-PATH --ssh-passphrase=SSH-PASSPHRASE --target-docker-image=TARGET-DOCKER-IMAGE --target-tag=TARGET-TAG --url=URL --user=USER

      - name: Act
        id: act
        uses: $/.github/actions/jfrog/rt/jfrog-rt-docker-promote
        with:
          source-docker-image: '[SOURCE-DOCKER-IMAGE]'
          source-repo: '[SOURCE-REPO]'
          target-repo: '[TARGET-REPO]'
          format: 'FORMAT'
          access-token: 'ACCESS-TOKEN'
          copy: 'true'
          password: 'PASSWORD'
          server-id: 'SERVER-ID'
          source-tag: 'SOURCE-TAG'
          ssh-key-path: 'SSH-KEY-PATH'
          ssh-passphrase: 'SSH-PASSPHRASE'
          target-docker-image: 'TARGET-DOCKER-IMAGE'
          target-tag: 'TARGET-TAG'
          url: 'URL'
          user: 'USER'
          shell: ${{ matrix.shell }}
          is-test: 'true'

      - name: Assert
        uses: $/.github/actions/tests/helper/assert-result
        with:
          result: ${{ steps.act.outputs.command }}
          expected-result: ${{ steps.arrange.outputs.expected-result }}