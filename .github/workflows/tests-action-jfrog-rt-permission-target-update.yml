name: Tests action 'jfrog-rt-permission-target-update'

on:
  workflow_call:

jobs:
  should_return_command:
    name: Should return command (${{ matrix.shell }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shell: [bash, pwsh]
    steps:
      - name: Arrange
        id: arrange
        uses: $/.github/actions/tests/helper/arrange-expected-result
        with:
          shell: ${{ matrix.shell }}
          expected-result-bash: jf rt permission-target-update \[TEMPLATE-PATH\] --access-token=ACCESS-TOKEN --client-cert-key-path=CLIENT-CERT-KEY-PATH --client-cert-path=CLIENT-CERT-PATH --format=FORMAT --password=PASSWORD --server-id=SERVER-ID --ssh-key-path=SSH-KEY-PATH --ssh-passphrase=SSH-PASSPHRASE --url=URL --user=USER --vars=VARS
          expected-result-pwsh: jf rt permission-target-update [TEMPLATE-PATH] --access-token=ACCESS-TOKEN --client-cert-key-path=CLIENT-CERT-KEY-PATH --client-cert-path=CLIENT-CERT-PATH --format=FORMAT --password=PASSWORD --server-id=SERVER-ID --ssh-key-path=SSH-KEY-PATH --ssh-passphrase=SSH-PASSPHRASE --url=URL --user=USER --vars=VARS

      - name: Act
        id: act
        uses: $/.github/actions/jfrog/rt/jfrog-rt-permission-target-update
        with:
          template-path: '[TEMPLATE-PATH]'
          access-token: 'ACCESS-TOKEN'
          client-cert-key-path: 'CLIENT-CERT-KEY-PATH'
          client-cert-path: 'CLIENT-CERT-PATH'
          format: 'FORMAT'
          password: 'PASSWORD'
          server-id: 'SERVER-ID'
          ssh-key-path: 'SSH-KEY-PATH'
          ssh-passphrase: 'SSH-PASSPHRASE'
          url: 'URL'
          user: 'USER'
          vars: 'VARS'
          shell: ${{ matrix.shell }}
          is-test: 'true'

      - name: Assert
        uses: $/.github/actions/tests/helper/assert-result
        with:
          result: ${{ steps.act.outputs.command }}
          expected-result: ${{ steps.arrange.outputs.expected-result }}