name: Tests action 'jfrog-rt-repo-delete'

on:
  workflow_call:

jobs:
  should_return_command:
    name: Should return command (${{ matrix.shell }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shell: [bash, pwsh]
    steps:
      - name: Arrange
        id: arrange
        uses: $/.github/actions/tests/helper/arrange-expected-result
        with:
          shell: ${{ matrix.shell }}
          expected-result-bash: jf rt repo-delete \[REPOSITORY-PATTERN\] --access-token=ACCESS-TOKEN --client-cert-key-path=CLIENT-CERT-KEY-PATH --client-cert-path=CLIENT-CERT-PATH --password=PASSWORD --quiet --server-id=SERVER-ID --ssh-key-path=SSH-KEY-PATH --ssh-passphrase=SSH-PASSPHRASE --url=URL --user=USER
          expected-result-pwsh: jf rt repo-delete [REPOSITORY-PATTERN] --access-token=ACCESS-TOKEN --client-cert-key-path=CLIENT-CERT-KEY-PATH --client-cert-path=CLIENT-CERT-PATH --password=PASSWORD --quiet --server-id=SERVER-ID --ssh-key-path=SSH-KEY-PATH --ssh-passphrase=SSH-PASSPHRASE --url=URL --user=USER

      - name: Act
        id: act
        uses: $/.github/actions/jfrog/rt/jfrog-rt-repo-delete
        with:
          repository-pattern: '[REPOSITORY-PATTERN]'
          access-token: 'ACCESS-TOKEN'
          client-cert-key-path: 'CLIENT-CERT-KEY-PATH'
          client-cert-path: 'CLIENT-CERT-PATH'
          password: 'PASSWORD'
          quiet: 'true'
          server-id: 'SERVER-ID'
          ssh-key-path: 'SSH-KEY-PATH'
          ssh-passphrase: 'SSH-PASSPHRASE'
          url: 'URL'
          user: 'USER'
          shell: ${{ matrix.shell }}
          is-test: 'true'

      - name: Assert
        uses: $/.github/actions/tests/helper/assert-result
        with:
          result: ${{ steps.act.outputs.command }}
          expected-result: ${{ steps.arrange.outputs.expected-result }}