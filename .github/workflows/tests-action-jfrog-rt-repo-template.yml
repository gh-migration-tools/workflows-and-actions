name: Tests action 'jfrog-rt-repo-template'

on:
  workflow_call:

jobs:
  should_return_command:
    name: Should return command (${{ matrix.shell }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shell: [bash, pwsh]
    steps:
      - name: Arrange
        id: arrange
        uses: $/.github/actions/tests/helper/arrange-expected-result
        with:
          shell: ${{ matrix.shell }}
          expected-result-bash: jf rt repo-template \[TEMPLATE-PATH\]
          expected-result-pwsh: jf rt repo-template [TEMPLATE-PATH]

      - name: Act
        id: act
        uses: $/.github/actions/jfrog/rt/jfrog-rt-repo-template
        with:
          template-path: '[TEMPLATE-PATH]'
          shell: ${{ matrix.shell }}
          is-test: 'true'

      - name: Assert
        uses: $/.github/actions/tests/helper/assert-result
        with:
          result: ${{ steps.act.outputs.command }}
          expected-result: ${{ steps.arrange.outputs.expected-result }}