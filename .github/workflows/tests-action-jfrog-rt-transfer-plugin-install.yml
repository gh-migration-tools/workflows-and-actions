name: Tests action 'jfrog-rt-transfer-plugin-install'

on:
  workflow_call:

jobs:
  should_return_command:
    name: Should return command (${{ matrix.shell }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shell: [bash, pwsh]
    steps:
      - name: Arrange
        id: arrange
        uses: $/.github/actions/tests/helper/arrange-expected-result
        with:
          shell: ${{ matrix.shell }}
          expected-result-bash: jf rt transfer-plugin-install \[SERVER-ID\] --dir=DIR --home-dir=HOME-DIR --version=VERSION
          expected-result-pwsh: jf rt transfer-plugin-install [SERVER-ID] --dir=DIR --home-dir=HOME-DIR --version=VERSION

      - name: Act
        id: act
        uses: $/.github/actions/jfrog/rt/jfrog-rt-transfer-plugin-install
        with:
          server-id: '[SERVER-ID]'
          dir: 'DIR'
          home-dir: 'HOME-DIR'
          version: 'VERSION'
          shell: ${{ matrix.shell }}
          is-test: 'true'

      - name: Assert
        uses: $/.github/actions/tests/helper/assert-result
        with:
          result: ${{ steps.act.outputs.command }}
          expected-result: ${{ steps.arrange.outputs.expected-result }}