name: Tests action 'jfrog-rt-users-delete'

on:
  workflow_call:

jobs:
  should_return_command:
    name: Should return command (${{ matrix.shell }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shell: [bash, pwsh]
    steps:
      - name: Act
        id: act
        uses: $/.github/actions/jfrog/rt/jfrog-rt-users-delete
        with:
          users-list: 'USERS-LIST'
          access-token: 'ACCESS-TOKEN'
          csv: 'CSV'
          password: 'PASSWORD'
          quiet: 'QUIET'
          server-id: 'SERVER-ID'
          ssh-key-path: 'SSH-KEY-PATH'
          ssh-passphrase: 'SSH-PASSPHRASE'
          url: 'URL'
          user: 'USER'
          shell: ${{ matrix.shell }}
          is-test: 'true'

      - name: Assert
        uses: $/.github/actions/tests/helper/assert-result
        with:
          result: ${{ steps.act.outputs.command }}
          expected-result: jf rt users-delete USERS-LIST --access-token=ACCESS-TOKEN --csv=CSV --password=PASSWORD --quiet=QUIET --server-id=SERVER-ID --ssh-key-path=SSH-KEY-PATH --ssh-passphrase=SSH-PASSPHRASE --url=URL --user=USER
