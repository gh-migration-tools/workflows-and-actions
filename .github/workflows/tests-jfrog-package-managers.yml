name: Tests actions 'jfrog package managers'

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]

jobs:
  setup:
    name: Setup
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      test-action-jfrog-apk: ${{ steps.changes.outputs.test-action-jfrog-apk }}
      test-action-jfrog-apt: ${{ steps.changes.outputs.test-action-jfrog-apt }}
      test-action-jfrog-cargo: ${{ steps.changes.outputs.test-action-jfrog-cargo }}
      test-action-jfrog-choco: ${{ steps.changes.outputs.test-action-jfrog-choco }}
      test-action-jfrog-conan: ${{ steps.changes.outputs.test-action-jfrog-conan }}
      test-action-jfrog-conan-config: ${{ steps.changes.outputs.test-action-jfrog-conan-config }}
      test-action-jfrog-docker: ${{ steps.changes.outputs.test-action-jfrog-docker }}
      test-action-jfrog-dotnet: ${{ steps.changes.outputs.test-action-jfrog-dotnet }}
      test-action-jfrog-dotnet-config: ${{ steps.changes.outputs.test-action-jfrog-dotnet-config }}
      test-action-jfrog-go: ${{ steps.changes.outputs.test-action-jfrog-go }}
      test-action-jfrog-go-config: ${{ steps.changes.outputs.test-action-jfrog-go-config }}
      test-action-jfrog-go-publish: ${{ steps.changes.outputs.test-action-jfrog-go-publish }}
      test-action-jfrog-gradle: ${{ steps.changes.outputs.test-action-jfrog-gradle }}
      test-action-jfrog-gradle-config: ${{ steps.changes.outputs.test-action-jfrog-gradle-config }}
      test-action-jfrog-helm: ${{ steps.changes.outputs.test-action-jfrog-helm }}
      test-action-jfrog-mvn: ${{ steps.changes.outputs.test-action-jfrog-mvn }}
      test-action-jfrog-mvn-config: ${{ steps.changes.outputs.test-action-jfrog-mvn-config }}
      test-action-jfrog-mvnw: ${{ steps.changes.outputs.test-action-jfrog-mvnw }}
      test-action-jfrog-nix: ${{ steps.changes.outputs.test-action-jfrog-nix }}
      test-action-jfrog-npm: ${{ steps.changes.outputs.test-action-jfrog-npm }}
      test-action-jfrog-npm-config: ${{ steps.changes.outputs.test-action-jfrog-npm-config }}
      test-action-jfrog-nuget: ${{ steps.changes.outputs.test-action-jfrog-nuget }}
      test-action-jfrog-nuget-config: ${{ steps.changes.outputs.test-action-jfrog-nuget-config }}
      test-action-jfrog-pip: ${{ steps.changes.outputs.test-action-jfrog-pip }}
      test-action-jfrog-pip-config: ${{ steps.changes.outputs.test-action-jfrog-pip-config }}
      test-action-jfrog-pipenv: ${{ steps.changes.outputs.test-action-jfrog-pipenv }}
      test-action-jfrog-pipenv-config: ${{ steps.changes.outputs.test-action-jfrog-pipenv-config }}
      test-action-jfrog-poetry: ${{ steps.changes.outputs.test-action-jfrog-poetry }}
      test-action-jfrog-poetry-config: ${{ steps.changes.outputs.test-action-jfrog-poetry-config }}
      test-action-jfrog-ruby: ${{ steps.changes.outputs.test-action-jfrog-ruby }}
      test-action-jfrog-terraform: ${{ steps.changes.outputs.test-action-jfrog-terraform }}
      test-action-jfrog-terraform-config: ${{ steps.changes.outputs.test-action-jfrog-terraform-config }}
      test-action-jfrog-twine: ${{ steps.changes.outputs.test-action-jfrog-twine }}
      test-action-jfrog-yarn: ${{ steps.changes.outputs.test-action-jfrog-yarn }}
      test-action-jfrog-yarn-config: ${{ steps.changes.outputs.test-action-jfrog-yarn-config }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2

      - name: Check workflows and actions chnages
        id: changes
        shell: bash
        env:
          ACTIONS: |
            jfrog-apk
            jfrog-apt
            jfrog-cargo
            jfrog-choco
            jfrog-conan
            jfrog-conan-config
            jfrog-docker
            jfrog-dotnet
            jfrog-dotnet-config
            jfrog-go
            jfrog-go-config
            jfrog-go-publish
            jfrog-gradle
            jfrog-gradle-config
            jfrog-helm
            jfrog-mvn
            jfrog-mvn-config
            jfrog-mvnw
            jfrog-nix
            jfrog-npm
            jfrog-npm-config
            jfrog-nuget
            jfrog-nuget-config
            jfrog-pip
            jfrog-pip-config
            jfrog-pipenv
            jfrog-pipenv-config
            jfrog-poetry
            jfrog-poetry-config
            jfrog-ruby
            jfrog-terraform
            jfrog-terraform-config
            jfrog-twine
            jfrog-yarn
            jfrog-yarn-config
        run: |
          check_changed() {
            ! git diff --quiet HEAD~1 HEAD -- "$1" || ! git diff --quiet HEAD~1 HEAD -- "$2"
          }

          while IFS= read -r name; do
            [[ -n "$name" ]] || continue
            changed=false
            if check_changed \
              ".github/actions/jfrog/package-managers/$name/action.yml" \
              ".github/workflows/tests-action-$name.yml"; then
              changed=true
            fi
            echo "test-action-$name=$changed" >> "$GITHUB_OUTPUT"
          done <<< "$ACTIONS"

  # -------------------------------------------------- #
  # Tests 'jfrog package managers' actions             #
  # -------------------------------------------------- #
  tests_action_jfrog_apk:
    if: ${{ needs.setup.outputs.test-action-jfrog-apk == 'true' }}
    needs: setup
    name: Tests action 'jfrog-apk'
    uses: $/.github/workflows/tests-action-jfrog-apk.yml

  tests_action_jfrog_apt:
    if: ${{ needs.setup.outputs.test-action-jfrog-apt == 'true' }}
    needs: setup
    name: Tests action 'jfrog-apt'
    uses: $/.github/workflows/tests-action-jfrog-apt.yml

  tests_action_jfrog_cargo:
    if: ${{ needs.setup.outputs.test-action-jfrog-cargo == 'true' }}
    needs: setup
    name: Tests action 'jfrog-cargo'
