name: Tests actions 'jfrog rt'

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]

jobs:
  setup:
    name: Setup
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      test-action-jfrog-rt-build-add-dependencies: ${{ steps.changes.outputs.test-action-jfrog-rt-build-add-dependencies }}
      test-action-jfrog-rt-build-add-git: ${{ steps.changes.outputs.test-action-jfrog-rt-build-add-git }}
      test-action-jfrog-rt-build-append: ${{ steps.changes.outputs.test-action-jfrog-rt-build-append }}
      test-action-jfrog-rt-build-clean: ${{ steps.changes.outputs.test-action-jfrog-rt-build-clean }}
      test-action-jfrog-rt-build-collect-env: ${{ steps.changes.outputs.test-action-jfrog-rt-build-collect-env }}
      test-action-jfrog-rt-build-discard: ${{ steps.changes.outputs.test-action-jfrog-rt-build-discard }}
      test-action-jfrog-rt-build-docker-create: ${{ steps.changes.outputs.test-action-jfrog-rt-build-docker-create }}
      test-action-jfrog-rt-build-promote: ${{ steps.changes.outputs.test-action-jfrog-rt-build-promote }}
      test-action-jfrog-rt-build-publish: ${{ steps.changes.outputs.test-action-jfrog-rt-build-publish }}
      test-action-jfrog-rt-copy: ${{ steps.changes.outputs.test-action-jfrog-rt-copy }}
      test-action-jfrog-rt-curl: ${{ steps.changes.outputs.test-action-jfrog-rt-curl }}
      test-action-jfrog-rt-delete: ${{ steps.changes.outputs.test-action-jfrog-rt-delete }}
      test-action-jfrog-rt-delete-props: ${{ steps.changes.outputs.test-action-jfrog-rt-delete-props }}
      test-action-jfrog-rt-direct-download: ${{ steps.changes.outputs.test-action-jfrog-rt-direct-download }}
      test-action-jfrog-rt-docker-promote: ${{ steps.changes.outputs.test-action-jfrog-rt-docker-promote }}
      test-action-jfrog-rt-download: ${{ steps.changes.outputs.test-action-jfrog-rt-download }}
      test-action-jfrog-rt-git-lfs-clean: ${{ steps.changes.outputs.test-action-jfrog-rt-git-lfs-clean }}
      test-action-jfrog-rt-group-add-users: ${{ steps.changes.outputs.test-action-jfrog-rt-group-add-users }}
      test-action-jfrog-rt-group-create: ${{ steps.changes.outputs.test-action-jfrog-rt-group-create }}
      test-action-jfrog-rt-group-delete: ${{ steps.changes.outputs.test-action-jfrog-rt-group-delete }}
      test-action-jfrog-rt-move: ${{ steps.changes.outputs.test-action-jfrog-rt-move }}
      test-action-jfrog-rt-nuget-deps-tree: ${{ steps.changes.outputs.test-action-jfrog-rt-nuget-deps-tree }}
      test-action-jfrog-rt-permission-target-create: ${{ steps.changes.outputs.test-action-jfrog-rt-permission-target-create }}
      test-action-jfrog-rt-permission-target-delete: ${{ steps.changes.outputs.test-action-jfrog-rt-permission-target-delete }}
      test-action-jfrog-rt-permission-target-template: ${{ steps.changes.outputs.test-action-jfrog-rt-permission-target-template }}
      test-action-jfrog-rt-permission-target-update: ${{ steps.changes.outputs.test-action-jfrog-rt-permission-target-update }}
      test-action-jfrog-rt-ping: ${{ steps.changes.outputs.test-action-jfrog-rt-ping }}
      test-action-jfrog-rt-podman-pull: ${{ steps.changes.outputs.test-action-jfrog-rt-podman-pull }}
      test-action-jfrog-rt-podman-push: ${{ steps.changes.outputs.test-action-jfrog-rt-podman-push }}
      test-action-jfrog-rt-replication-create: ${{ steps.changes.outputs.test-action-jfrog-rt-replication-create }}
      test-action-jfrog-rt-replication-delete: ${{ steps.changes.outputs.test-action-jfrog-rt-replication-delete }}
      test-action-jfrog-rt-replication-template: ${{ steps.changes.outputs.test-action-jfrog-rt-replication-template }}
      test-action-jfrog-rt-repo-create: ${{ steps.changes.outputs.test-action-jfrog-rt-repo-create }}
      test-action-jfrog-rt-repo-delete: ${{ steps.changes.outputs.test-action-jfrog-rt-repo-delete }}
      test-action-jfrog-rt-repo-template: ${{ steps.changes.outputs.test-action-jfrog-rt-repo-template }}
      test-action-jfrog-rt-repo-update: ${{ steps.changes.outputs.test-action-jfrog-rt-repo-update }}
      test-action-jfrog-rt-search: ${{ steps.changes.outputs.test-action-jfrog-rt-search }}
      test-action-jfrog-rt-set-props: ${{ steps.changes.outputs.test-action-jfrog-rt-set-props }}
      test-action-jfrog-rt-transfer-config: ${{ steps.changes.outputs.test-action-jfrog-rt-transfer-config }}
      test-action-jfrog-rt-transfer-config-merge: ${{ steps.changes.outputs.test-action-jfrog-rt-transfer-config-merge }}
      test-action-jfrog-rt-transfer-files: ${{ steps.changes.outputs.test-action-jfrog-rt-transfer-files }}
      test-action-jfrog-rt-transfer-plugin-install: ${{ steps.changes.outputs.test-action-jfrog-rt-transfer-plugin-install }}
      test-action-jfrog-rt-transfer-settings: ${{ steps.changes.outputs.test-action-jfrog-rt-transfer-settings }}
      test-action-jfrog-rt-upload: ${{ steps.changes.outputs.test-action-jfrog-rt-upload }}
      test-action-jfrog-rt-user-create: ${{ steps.changes.outputs.test-action-jfrog-rt-user-create }}
      test-action-jfrog-rt-users-create: ${{ steps.changes.outputs.test-action-jfrog-rt-users-create }}
      test-action-jfrog-rt-users-delete: ${{ steps.changes.outputs.test-action-jfrog-rt-users-delete }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2

      - name: Check workflows and actions chnages
        id: changes
        shell: bash
        env:
          ACTIONS: |
            jfrog-rt-build-add-dependencies
            jfrog-rt-build-add-git
            jfrog-rt-build-append
            jfrog-rt-build-clean
            jfrog-rt-build-collect-env
            jfrog-rt-build-discard
            jfrog-rt-build-docker-create
            jfrog-rt-build-promote
            jfrog-rt-build-publish
            jfrog-rt-copy
            jfrog-rt-curl
            jfrog-rt-delete
            jfrog-rt-delete-props
            jfrog-rt-direct-download
            jfrog-rt-docker-promote
            jfrog-rt-download
            jfrog-rt-git-lfs-clean
            jfrog-rt-group-add-users
            jfrog-rt-group-create
            jfrog-rt-group-delete
            jfrog-rt-move
            jfrog-rt-nuget-deps-tree
            jfrog-rt-permission-target-create
            jfrog-rt-permission-target-delete
            jfrog-rt-permission-target-template
            jfrog-rt-permission-target-update
            jfrog-rt-ping
            jfrog-rt-podman-pull
            jfrog-rt-podman-push
            jfrog-rt-replication-create
            jfrog-rt-replication-delete
            jfrog-rt-replication-template
            jfrog-rt-repo-create
            jfrog-rt-repo-delete
            jfrog-rt-repo-template
            jfrog-rt-repo-update
            jfrog-rt-search
            jfrog-rt-set-props
            jfrog-rt-transfer-config
            jfrog-rt-transfer-config-merge
            jfrog-rt-transfer-files
            jfrog-rt-transfer-plugin-install
            jfrog-rt-transfer-settings
            jfrog-rt-upload
            jfrog-rt-user-create
            jfrog-rt-users-create
            jfrog-rt-users-delete
        run: |
          check_changed() {
            ! git diff --quiet HEAD~1 HEAD -- "$1" || ! git diff --quiet HEAD~1 HEAD -- "$2"
          }

          while IFS= read -r name; do
            [[ -n "$name" ]] || continue
            changed=false
            if check_changed \
              ".github/actions/jfrog/rt/$name/action.yml" \
              ".github/workflows/tests-action-$name.yml"; then
              changed=true
            fi
            echo "test-action-$name=$changed" >> "$GITHUB_OUTPUT"
          done <<< "$ACTIONS"

  # -------------------------------------------------- #
  # Tests 'jfrog rt' actions                           #
  # -------------------------------------------------- #
  tests_action_jfrog_rt_build_add_dependencies:
    if: ${{ needs.setup.outputs.test-action-jfrog-rt-build-add-dependencies == 'true' }}
