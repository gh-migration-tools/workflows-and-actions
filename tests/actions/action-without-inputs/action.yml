name: Tests action
description: Tests action without inputs

outputs:
  result:
    description: result
    value: ${{ steps.run.outputs.result }}

runs:
  using: composite
  steps:
    - name: Run
      id: run
      shell: bash
      run: |
        result="Hello Mr. John Doe"
        echo "$result"
        echo "result=$result" >> "$GITHUB_OUTPUT"