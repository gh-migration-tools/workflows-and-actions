name: Build
description: Build

inputs:
  pre-build-steps:
    description: Pre-build steps
    required: false
    default: ''
  post-build-steps:
    description: Post-build steps
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Run pre-build steps
      uses: $/.github/actions/dynamic-action-steps
      if: ${{ inputs.pre-build-steps != '' }}
      with:
        debug: true
        steps: ${{ inputs.pre-build-steps }}

    - name: Build
      shell: bash
      run: echo "Execute build step"

    - name: Run post-build steps
      uses: $/.github/actions/dynamic-action-steps
      if: ${{ inputs.post-build-steps != '' }}
      with:
        debug: true
        steps: ${{ inputs.post-build-steps }}